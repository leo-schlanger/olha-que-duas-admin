<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
/* V3b — "Estúdio": the logo wears studio headphones; equaliser meter as the floor. */
.c{background:var(--bordo-900);color:#f6ead2}
.grid{position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 44px,rgba(201,153,63,.11) 44px 45px,transparent 45px 146px),
             repeating-linear-gradient(180deg,transparent 0 23px,rgba(201,153,63,.05) 23px 24px)}
.tone{position:absolute;left:0;right:0;top:60px;height:620px;
  background:radial-gradient(circle,var(--vermelho) 0 40%,transparent 42%) 0 0/14px 14px;
  -webkit-mask:radial-gradient(46% 46% at 50% 52%,rgba(0,0,0,.75),transparent 75%);opacity:.55}
.hp{position:absolute;left:0;top:0;width:900px;height:700px;z-index:4}
.hpb{z-index:2}
.logoXL{position:absolute;left:50%;top:168px;width:480px;height:480px;transform:translateX(-50%);z-index:3;
  filter:drop-shadow(0 22px 40px rgba(0,0,0,.6))}
.sec{position:absolute;left:44px;top:56px;font:700 15px/1 Inter;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro)}
.air{position:absolute;right:44px;top:46px;display:flex;align-items:center;gap:10px;font:800 15px/1 Inter;letter-spacing:.26em;text-transform:uppercase;color:#ffd9d4}
.air i{width:14px;height:14px;border-radius:50%;background:#ff3b2e;box-shadow:0 0 16px 4px rgba(255,59,46,.7)}
.mast{position:absolute;left:44px;right:44px;top:700px}
.mast h1{font:italic 900 290px/.86 Playfair;letter-spacing:-.04em;color:#fbf1dc;margin-left:14px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.mast h2{margin-top:18px;font:600 66px/1 Playfair;letter-spacing:-.01em;color:var(--amarelo)}
.mast h2 i{font-weight:500;color:#f6ead2}
.eq{position:absolute;left:44px;right:44px;bottom:40px;height:72px;display:flex;align-items:flex-end;gap:5px}
.eq span{flex:1;border-radius:2px 2px 0 0;
  background:repeating-linear-gradient(0deg,currentColor 0 6px,transparent 6px 9px)}
.grain{mix-blend-mode:screen;opacity:.16;filter:invert(1)}
</style></head><body>
<div class="c">
  <div class="grid"></div>
  <div class="tone"></div>
  <!-- headband + sliders: behind the logo -->
  <svg class="hp hpb" viewBox="0 0 900 700">
    <defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#9a7028"/><stop offset=".5" stop-color="#f6cf6a"/><stop offset="1" stop-color="#9a7028"/></linearGradient></defs>
    <path d="M245 330 C245 140 340 104 450 104 C560 104 655 140 655 330" fill="none" stroke="#12030a" stroke-width="40" stroke-linecap="round"/>
    <path d="M245 330 C245 140 340 104 450 104 C560 104 655 140 655 330" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" transform="translate(0,-10)"/>
    <rect x="236" y="290" width="18" height="50" rx="6" fill="#2a0b12" stroke="#c9993f" stroke-width="3"/>
    <rect x="646" y="290" width="18" height="50" rx="6" fill="#2a0b12" stroke="#c9993f" stroke-width="3"/>
  </svg>
  <img class="logoXL" src="../assets/logo.webp" alt="Olha que Duas">
  <!-- ear cups: in front of the logo edge -->
  <svg class="hp" viewBox="0 0 900 700">
    <defs><linearGradient id="cup" x1="0" x2="1"><stop offset="0" stop-color="#3a0f18"/><stop offset="1" stop-color="#14040a"/></linearGradient></defs>
    <g filter="drop-shadow(0 10px 14px rgba(0,0,0,.55))">
      <rect x="203" y="318" width="84" height="180" rx="40" fill="url(#cup)" stroke="#f2c14e" stroke-width="5"/>
      <rect x="219" y="338" width="52" height="140" rx="26" fill="none" stroke="#c9993f" stroke-width="2" opacity=".7"/>
      <rect x="613" y="318" width="84" height="180" rx="40" fill="url(#cup)" stroke="#f2c14e" stroke-width="5"/>
      <rect x="629" y="338" width="52" height="140" rx="26" fill="none" stroke="#c9993f" stroke-width="2" opacity=".7"/>
    </g>
  </svg>
  <div class="sec">Especiais</div>
  <div class="air"><i></i>No ar</div>
  <div class="mast">
    <h1 data-fitw>Notícias</h1>
    <h2>Olha que <i>Duas</i></h2>
  </div>
  <div class="eq" id="eq"></div>
  <div class="grain"></div>
</div>
<script>
// Spectrum meter: stepped LED bars, yellow to red.
const eq = document.getElementById("eq"); let h = "";
for (let i = 0; i < 48; i++) {
  const v = 0.18 + 0.82 * Math.abs(Math.sin(i * 0.55) * 0.6 + Math.sin(i * 1.7 + 2) * 0.3 + (i < 14 ? 0.25 : 0)) ;
  const c = v > 0.75 ? "#e0402f" : v > 0.45 ? "#f2c14e" : "#c9993f";
  h += `<span style="height:${Math.min(100, v * 100)}%;color:${c};opacity:${0.55 + v * 0.45}"></span>`;
}
eq.innerHTML = h;
</script>
<script src="_fit.js"></script></body></html>
