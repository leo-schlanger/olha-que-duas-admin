<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<!-- Editorial cover for this piece, v3a family (night burgundy, Playfair italic, gold).
     Render: W=1600 H=1000 node ../programa/render.mjs "<this>#f=capa&v=a" out.jpg  (f=capa|og, v=a|b) -->
<link rel="stylesheet" href="../programa/_base.css">
<style>
html,body{width:auto;height:auto}
.c{width:var(--w);height:var(--h);--u:calc(var(--h) / 630);background:var(--bordo-900);color:#f6ead2}
.logo{left:calc(30*var(--u));top:calc(26*var(--u));width:calc(96*var(--u));height:calc(96*var(--u));filter:drop-shadow(0 calc(4*var(--u)) calc(10*var(--u)) rgba(0,0,0,.5))}
/* warm studio light from the photo side */
.glow{position:absolute;inset:0;background:radial-gradient(60% 90% at 78% 40%,rgba(92,15,32,.95),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.6;
  background:repeating-linear-gradient(90deg,transparent 0 calc(44*var(--u)),rgba(201,153,63,.08) calc(44*var(--u)) calc(45*var(--u)),transparent calc(45*var(--u)) calc(146*var(--u)))}
.ph{position:absolute;background-repeat:no-repeat;background-size:cover}
.film{position:absolute;pointer-events:none}
/* text column */
.col{position:absolute;display:flex;flex-direction:column;justify-content:center}
.lab{display:flex;align-items:center;gap:calc(10*var(--u));font:800 calc(13*var(--u))/1 Inter;letter-spacing:.3em;text-transform:uppercase;color:var(--amarelo)}
.lab i{width:calc(9*var(--u));height:calc(9*var(--u));border-radius:50%;background:#ff3b2e;box-shadow:0 0 calc(10*var(--u)) calc(2*var(--u)) rgba(255,59,46,.6)}
.lab span.s{color:rgba(246,234,210,.55);font-weight:600}
/* hairline that ends in a scalpel blade: the only nod to the subject */
.blade{display:block;margin:calc(16*var(--u)) 0;height:calc(10*var(--u));width:100%}
.mast{font:italic 900 calc(104*var(--u))/.9 Playfair;letter-spacing:-.035em;color:#fbf1dc}
.mast2{margin-top:calc(8*var(--u));font:600 calc(32*var(--u))/1 Playfair;color:var(--amarelo)}
.mast2 i{font-weight:500;color:#f6ead2}
h1{font:800 calc(60*var(--u))/1.0 Playfair;letter-spacing:-.015em;color:#fbf1dc}
h1 em{font-style:italic;font-weight:700;color:var(--amarelo)}
.dt{margin-top:calc(14*var(--u));font:italic 500 calc(17*var(--u))/1 Playfair;color:rgba(246,234,210,.7)}
.wave{position:absolute;height:calc(34*var(--u))}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* A: photo 5 on the right, bled into the burgundy */
.A .ph{right:0;top:0;bottom:0;width:56%;background-image:url('../../../supabase/rascunhos/cristina-ferreira-fotos/5-cristina-rosa.jpg');background-position:50% 30%;
  filter:saturate(.82) contrast(1.06);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 14%,#000 32%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 14%,#000 32%)}
.A .film{right:0;top:0;bottom:0;width:56%;mix-blend-mode:multiply;
  mask-image:linear-gradient(90deg,transparent 0,#000 30%);
  background:linear-gradient(90deg,transparent 0%,rgba(92,15,32,.45) 30%,rgba(92,15,32,.15) 60%,rgba(36,7,14,.5) 100%),
             linear-gradient(0deg,rgba(36,7,14,.85) 0%,transparent 35%)}
.A .col{left:calc(34*var(--u));width:44%;top:calc(130*var(--u));bottom:calc(70*var(--u))}
.A.og .ph,.A.og .film{width:54%}
.A.og .ph{background-position:50% 26%}
.A.og .col{width:44%}
.og .lab{font-size:calc(15*var(--u))}
.og .dt{font-size:calc(19*var(--u))}

/* B: photo 6 framed on the left, logo sealing the corner, text on the right */
.B .glow{background:radial-gradient(70% 90% at 26% 45%,rgba(92,15,32,.95),transparent 70%)}
.B .ph{left:calc(64*var(--u));top:calc(58*var(--u));bottom:calc(46*var(--u));width:34%;background-image:url('../../../supabase/rascunhos/cristina-ferreira-fotos/6-cristina-bege.jpg');background-position:50% 18%;
  box-shadow:0 calc(18*var(--u)) calc(40*var(--u)) rgba(0,0,0,.55);filter:contrast(1.05) saturate(.95)}
.B .film{left:calc(64*var(--u));top:calc(58*var(--u));bottom:calc(46*var(--u));width:34%;
  background:linear-gradient(0deg,rgba(36,7,14,.45),transparent 40%);outline:calc(1.5*var(--u)) solid rgba(242,193,78,.75);outline-offset:calc(10*var(--u))}
.B .col{right:calc(44*var(--u));left:calc(34% + 120*var(--u));top:calc(60*var(--u));bottom:calc(70*var(--u))}
.B.og .ph,.B.og .film{width:36%}
.B.og .col{left:calc(36% + 112*var(--u))}
</style></head><body>
<div class="c" id="c">
  <div class="glow"></div><div class="grid"></div>
  <div class="ph"></div><div class="film"></div>
  <div class="col" id="col"></div>
  <svg class="wave" id="wave"></svg>
  <img class="logo" src="../assets/logo.webp" alt="">
  <div class="grain"></div>
</div>
<script>
const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const og = q.f === "og", v = (q.v || "a").toUpperCase();
const c = document.getElementById("c");
c.classList.add(v, og ? "og" : "capa");
c.style.setProperty("--w", (og ? 1200 : 1600) + "px");
c.style.setProperty("--h", (og ? 630 : 1000) + "px");
document.body.style.width = c.style.getPropertyValue("--w");
const blade = `<svg class="blade" viewBox="0 0 400 10" preserveAspectRatio="xMinYMid meet">
  <line x1="0" y1="5" x2="352" y2="5" stroke="#c9993f" stroke-width="1.2"/>
  <path d="M352 3.6 L372 3.6 C384 3.6 394 5 398 7.6 L352 6.4 Z" fill="#f2c14e"/></svg>`;
const data = "28 de outubro de 2026";
document.getElementById("col").innerHTML = og
  ? `<div class="lab"><i></i>Notícias</div>${blade}
     <h1>Cristina Ferreira<br>vai ao <em>bloco operatório</em></h1>
     <div class="dt">${data}</div>`
  : `<div class="lab"><i></i>Especiais Olha que Duas</div>${blade}
     <div class="mast">Notícias</div>
     <div class="dt">${data}</div>`;
// v3a signature: a low voice waveform along the bottom of the text column
const w = document.getElementById("wave"), n = 44, u = (og ? 630 : 1000) / 630;
w.setAttribute("viewBox", `0 0 ${n * 10} 34`);
w.style.width = (n * 10 * u * .9) + "px";
w.style.left = (v === "A" ? 34 * u : (og ? 1200 : 1600) * (v === "A" ? 0 : 1) - n * 10 * u * .9 - 44 * u) + "px";
w.style.bottom = (26 * u) + "px";
let s = "";
for (let i = 0; i < n; i++) {
  const a = Math.abs(Math.sin(i * .9) * .55 + Math.sin(i * 2.3 + 1) * .3 + Math.sin(i * .37) * .25);
  const h = Math.max(3, 32 * (.2 + a * .8) * (1 - i / n * .6));
  s += `<rect x="${i * 10 + 3}" y="${17 - h / 2}" width="4" height="${h}" rx="2" fill="#c9993f" opacity="${.75 - i / n * .5}"/>`;
}
w.innerHTML = s;
</script></body></html>
