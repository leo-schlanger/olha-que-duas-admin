<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<!-- Covers for the housing-crisis piece (Notícias). The client's illustration is the hero and
     already carries the headline, so no format repeats it. A broadcast "bug" (logo + Notícias tag
     on an opaque plate) sits top-left and hides the "CapCut AI" watermark of the source art.
     Render: W=.. H=.. node ../programa/render.mjs "<this>#m=capa" out.jpg
     m = capa 1600x1000 | og 1200x630 | reel 1080x1920 | sq 1080x1080 ; add &dbg=1 to see the watermark box -->
<link rel="stylesheet" href="../programa/_base.css">
<style>
html,body{width:auto;height:auto}
.c{width:var(--w);height:var(--h);background:var(--bordo-900)}
.art{position:absolute;max-width:none;transform-origin:0 0}
.bug{position:absolute;left:0;top:0;z-index:10;background:var(--bordo-900);border-bottom-right-radius:calc(22*var(--k));
  box-shadow:0 calc(6*var(--k)) calc(22*var(--k)) rgba(0,0,0,.45);border-right:calc(2*var(--k)) solid var(--ouro);border-bottom:calc(2*var(--k)) solid var(--ouro)}
.logo{z-index:12;filter:drop-shadow(0 calc(4*var(--k)) calc(10*var(--k)) rgba(0,0,0,.5))}
.tag{position:absolute;z-index:12;display:flex;align-items:stretch;font:800 calc(15*var(--k))/1 Inter;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.tag span{background:var(--vermelho);color:#fff;padding:calc(9*var(--k)) calc(14*var(--k))}
.tag time{background:var(--amarelo);color:#2a0d12;padding:calc(9*var(--k)) calc(14*var(--k));letter-spacing:.08em}
.band{position:absolute;left:0;right:0;bottom:0;background:var(--bordo-900);border-top:calc(2*var(--k)) solid var(--ouro)}
.bars{position:absolute;display:flex;align-items:flex-end;justify-content:space-between}
.bars span{flex:1;max-width:calc(9*var(--k));border-radius:2px 2px 0 0}
.site{position:absolute;font:700 calc(15*var(--k))/1 Inter;letter-spacing:.26em;text-transform:uppercase;color:rgba(246,234,210,.7);white-space:nowrap}
.site b{color:var(--amarelo);font-weight:800}
.lab{position:absolute;z-index:12;display:flex;align-items:center;gap:calc(10*var(--k));font:800 calc(14*var(--k))/1 Inter;letter-spacing:.28em;text-transform:uppercase;color:var(--amarelo);white-space:nowrap}
.lab i{width:calc(9*var(--k));height:calc(9*var(--k));border-radius:50%;background:#ff3b2e;box-shadow:0 0 calc(10*var(--k)) calc(3*var(--k)) rgba(255,59,46,.6)}
.dbg{position:absolute;z-index:30;border:2px solid #0f0;background:rgba(0,255,0,.12)}
</style></head><body>
<div class="c" id="c"></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const m = P.get("m") || "capa";
const DATA = "20 nov 2026";
const ART = "../../../supabase/rascunhos/crise-habitacao-nuno-homem-de-sa/fonte/arte-limpa.jpg";
const AW = 2048, AH = 1152;
// watermark boxes in source pixels (text "CapCut AI"); the paper smudge on the sign was cleaned in arte-limpa.jpg
const WM = [[30, 38, 400, 104]];
// per format: canvas, k (1px at 630 tall), art scale and origin, bug plate size
const F = {
  capa: { w: 1600, h: 1000, s: 1600 / AW, x: 0, y: 0, band: 100 },
  og:   { w: 1200, h: 630,  s: 1200 / AW, x: 0, y: 0, band: 0 },
  reel: { w: 1080, h: 1920, s: 1.06, x: -495 * 1.06, y: 420, band: 0 },
  sq:   { w: 1080, h: 1080, s: 940 / AH, x: -490 * 940 / AH, y: 140, band: 0 },
}[m];
const k = m === "og" ? 1 : m === "capa" ? 1000 / 630 : 1080 / 630 * .82;
const c = document.getElementById("c");
c.style.setProperty("--w", F.w + "px"); c.style.setProperty("--h", F.h + "px"); c.style.setProperty("--k", k + "px");
document.body.style.width = F.w + "px";

const bars = (n, x, y, w, h) => {
  let s = ""; for (let i = 0; i < n; i++) {
    const a = Math.abs(Math.sin(i * .9) * .55 + Math.sin(i * 2.3 + 1) * .3 + Math.sin(i * .37) * .25);
    s += `<span style="height:${(18 + a * 82).toFixed(0)}%;background:${i % 9 === 4 ? "rgba(242,193,78,.6)" : "rgba(201,153,63,.22)"}"></span>`;
  }
  return `<div class="bars" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${s}</div>`;
};
const tag = (x, y, kick = true, date = true) => `<div class="tag" style="left:${x}px;top:${y}px">${kick ? "<span>Notícias</span>" : ""}${date ? `<time>${DATA}</time>` : ""}</div>`;
const logo = (x, y, d) => `<img class="logo" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px" src="../assets/logo.webp" alt="">`;

let h = `<img class="art" src="${ART}" style="left:${F.x}px;top:${F.y}px;width:${AW * F.s}px;height:${AH * F.s}px" alt="">`;

if (m === "capa") {
  // opaque bug over the watermark (capa px 23-313 x 30-81); it must end before the painted headline (x 445)
  h += `<div class="bug" style="width:372px;height:100px"></div>${logo(24, 12, 150)}${tag(192, 30, true, false)}
    <div class="band" style="height:${F.band}px">${tag(40, 30, false, true)}${bars(120, 290, 24, 900, 52)}
      <div class="site" style="right:40px;top:42px">olhaqueduas.com</div></div>`;
} else if (m === "og") {
  // bug ends before the headline (og x 334); the date sits on the dark dress, bottom-left
  h += `<div class="bug" style="width:262px;height:68px"></div>${logo(12, 6, 96)}${tag(122, 16, true, false)}${tag(18, 578, false, true)}`;
} else if (m === "reel") {
  // header below the top UI zone (y >= 250) and inside the 3:4 grid crop (y 240-1680); art y 420-1641
  h += `<div class="band" style="top:0;bottom:auto;height:420px;border-top:0;border-bottom:calc(2*var(--k)) solid var(--ouro)"></div>
    ${logo(48, 262, 140)}${tag(212, 306)}
    <div class="band" style="top:1641px">${bars(80, 48, 40, 984, 70)}
      <div class="site" style="left:48px;top:150px">olhaqueduas.com</div></div>`;
} else if (m === "sq") {
  h += `<div class="band" style="top:0;bottom:auto;height:140px;border-top:0;border-bottom:calc(2*var(--k)) solid var(--ouro)"></div>
    ${logo(36, 14, 112)}${tag(170, 46)}
    <div class="site" style="right:40px;top:62px">olhaqueduas.com</div>`;
}
if (P.get("dbg")) for (const [x0, y0, x1, y1] of WM)
  h += `<div class="dbg" style="left:${F.x + x0 * F.s}px;top:${F.y + y0 * F.s}px;width:${(x1 - x0) * F.s}px;height:${(y1 - y0) * F.s}px"></div>`;
c.innerHTML = h;
</script></body></html>
